<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Task Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen">
    <div class="max-w-3xl mx-auto px-4 py-6">

        <div class="mb-4">
            <a href="progress.html" class="text-blue-600 text-sm">← Back to progress</a>
        </div>

        <div id="mustLoginBox" class="hidden bg-yellow-50 border border-yellow-200 text-yellow-800 p-4 rounded-xl mb-4">
            Please sign in.
        </div>

        <section class="bg-white rounded-xl shadow p-4 space-y-2">
            <h1 id="name" class="text-xl font-bold"></h1>

            <div id="meta" class="text-sm text-slate-600"></div>

            <div class="border-t pt-3">
                <h2 class="font-semibold">Current period</h2>
                <div id="periodRange" class="text-sm text-slate-700"></div>
                <div id="periodCount" class="text-sm text-slate-700 mt-1"></div>
            </div>

            <div class="border-t pt-3">
                <h2 class="font-semibold">Completions in this period</h2>
                <ul id="completionDates" class="list-disc pl-5 text-sm text-slate-700 mt-2"></ul>
                <p id="noCompletions" class="text-sm text-slate-500 mt-2 hidden">No completions in this period yet.</p>
            </div>

            <div>
                <h2 class="font-semibold mt-3">Notes</h2>
                <p id="notes" class="text-sm text-slate-700 whitespace-pre-wrap"></p>
            </div>
        </section>

    </div>

    <script type="module" src="ui-auth.js"></script>
    <script type="module" src="task.js"></script>
</body>

</html>
