<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="habitick-api-base" content="https://habitick.onrender.com" />
    <title>Life Tasks - Encouragement</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="dark.css">
    <script>
        // Initialize dark mode BEFORE Tailwind loads
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
  </head>

  <body class="bg-slate-100 dark:bg-slate-900 min-h-screen transition-colors">
    <div class="max-w-5xl mx-auto px-4 pt-6">
      <div class="bg-white dark:bg-slate-800 dark:text-white rounded-xl shadow p-4 flex items-center justify-between">
        <div class="text-sm">
          <span class="text-slate-500 dark:text-slate-400">Signed in as:</span>
          <span id="userEmail" class="font-semibold dark:text-white">—</span>
        </div>
        <div class="flex gap-2">
          <button id="themeToggle" class="px-3 py-2 rounded-lg border dark:border-slate-600 text-lg">🌙</button>
                <button id="loginBtn" class="px-3 py-2 rounded-lg bg-blue-600 text-white text-sm">Sign in</button>
          <button id="signupBtn" class="px-3 py-2 rounded-lg border text-sm dark:border-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700">Sign up</button>
          <button id="logoutBtn" class="px-3 py-2 rounded-lg border text-sm hidden dark:border-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700">Logout</button>
        </div>
      </div>

      <div class="mt-4 flex gap-4 text-sm">
        <a class="text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200" href="index.html">Today</a>
        <a class="text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200" href="progress.html">Progress</a>
        <a class="font-semibold text-blue-600 dark:text-blue-400" href="encouragement.html">Encouragement</a>
      </div>
    </div>

    <main class="max-w-5xl mx-auto px-4 py-6">
      <h1 class="text-2xl font-bold mb-4 dark:text-white">Encouragement</h1>
      <p class="text-slate-600 dark:text-slate-400 text-sm">
        Next we’ll build saving encouragement messages + AI encouragement.
      </p>
    </main>

    <script type="module" src="ui-auth.js"></script>
    <script type="module" src="theme-utils.js"></script>
    <script type="module" src="encouragement.js"></script>
  </body>
</html>
