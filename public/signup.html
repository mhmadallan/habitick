<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="habitick-api-base" content="https://habitick.onrender.com" />
    <title>Habitick - Sign up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="dark.css">
    <script>
        // Initialize dark mode BEFORE Tailwind loads
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
  </head>
  <body class="bg-slate-100 dark:bg-slate-900 min-h-screen transition-colors">
    <main class="max-w-md mx-auto px-4 py-10">
      <section class="bg-white dark:bg-slate-800 dark:text-white rounded-xl shadow p-6 space-y-4">
        <div>
          <h1 class="text-2xl font-bold">Create account</h1>
          <p class="text-sm text-slate-600 dark:text-slate-400">Sign up with email and password.</p>
        </div>

        <form id="signupForm" class="space-y-3">
          <div>
            <label class="block text-sm mb-1 dark:text-slate-300" for="email">Email</label>
            <input id="email" type="email" class="w-full border dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-lg px-3 py-2" required />
          </div>

          <div>
            <label class="block text-sm mb-1 dark:text-slate-300" for="password">Password</label>
            <input id="password" type="password" class="w-full border dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-lg px-3 py-2" minlength="6" required />
          </div>

          <div>
            <label class="block text-sm mb-1 dark:text-slate-300" for="confirmPassword">Confirm password</label>
            <input id="confirmPassword" type="password" class="w-full border dark:border-slate-600 dark:bg-slate-700 dark:text-white rounded-lg px-3 py-2" minlength="6" required />
          </div>

          <button id="submitBtn" type="submit" class="w-full px-4 py-2 rounded-lg bg-blue-600 text-white text-sm hover:bg-blue-700">
            Create account
          </button>
        </form>

        <p id="message" class="text-sm text-slate-600 dark:text-slate-400 hidden"></p>
        <p id="error" class="text-sm text-red-600 dark:text-red-400 hidden"></p>

        <div class="pt-2 border-t dark:border-slate-700 text-sm flex items-center justify-between">
          <a href="signin.html" class="text-blue-600 dark:text-blue-400">Already have an account? Sign in</a>
          <button id="googleBtn" class="px-3 py-2 rounded-lg border dark:border-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700">Sign in with Google</button>
        </div>
      </section>
    </main>

    <!-- Capacitor for mobile app support -->
    <script src="cordova.js"></script>
    <script type="module" src="signup.js"></script>
  </body>
</html>
